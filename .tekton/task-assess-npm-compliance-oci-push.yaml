apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/calungaproject/plumbing?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "main" && ( "tasks/assess-npm-compliance-oci-ta.yaml".pathChanged() || ".tekton/task-assess-npm-compliance-oci-push.yaml".pathChanged() || ".tekton/bundle-build-pipeline.yaml".pathChanged() )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: calunga-v2
    # Quay/component name kept as task-promote-npm-oci so existing Konflux
    # ImageRepository + SA continue to work; Task metadata.name is assess-*.
    appstudio.openshift.io/component: task-promote-npm-oci
    pipelines.appstudio.openshift.io/type: build
  name: task-assess-npm-compliance-oci-on-push
  namespace: calunga-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/calunga-tenant/task-promote-npm-oci:{{revision}}
    - name: dockerfile
      value: Dockerfile
    - name: path-context
      value: tasks/assess-npm-compliance-oci-ta.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-task-promote-npm-oci
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
  pipelineRef:
    name: bundle-build
status: {}
