apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: wheel-integration-test
spec:
  description: >-
    Verifies that the built wheels can be installed and imported
    on the target operating system.
  params:
    - description: The JSON string of the Snapshot under test
      name: SNAPSHOT
      type: string
    - description: The image used for smoke testing the built wheels
      name: TEST_IMAGE
      type: string
    - description: >-
        Optional URL of a wheel server (PEP 503 simple index) used to resolve
        the dependencies of the wheels under test. Must use https and must not
        embed credentials. When empty, pip runs with --no-index and only the
        wheels extracted from the SNAPSHOT can be installed.
      name: WHEEL_SERVER_URL
      type: string
      default: ""
    - description: >-
        Name of the Kubernetes secret with the wheel server's basic-auth
        credentials. The secret must provide username and password keys.
        Only consulted when WHEEL_SERVER_URL is set.
      name: SERVICE_ACCOUNT_SECRET_NAME
      type: string
      default: "builder-service-account"
  tasks:
    - name: install-and-import-wheels
      taskRef:
        resolver: git
        params:
        - name: url 
          value: https://github.com/calungaproject/plumbing
        - name: revision
          value: main
        - name: pathInRepo
          value: tasks/install-and-import-wheels.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: TEST_IMAGE
          value: $(params.TEST_IMAGE)
        - name: WHEEL_SERVER_URL
          value: $(params.WHEEL_SERVER_URL)
        - name: SERVICE_ACCOUNT_SECRET_NAME
          value: $(params.SERVICE_ACCOUNT_SECRET_NAME)
