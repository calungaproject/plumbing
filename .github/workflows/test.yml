name: Test Suite

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  collect-build-files:
    name: collect-build-files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Run collect-build-files tests
      run: ./tests/test-collect-build-files.sh

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Always pull the published builder image rather than rebuilding it here:
    # Konflux builds the real image, and denylist coverage is the job above.
    - name: Run test suite (pull published builder image)
      run: ./tests/test-build-wheels.sh --skip-build

    - name: Run pulp upload debug shell test
      run: ./utils/tests/pulp_upload_debug_test.sh
