name: Test Suite

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  collect-build-files:
    name: collect-build-files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Run collect-build-files tests
      run: ./tests/test-collect-build-files.sh

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check for changes in builder/
      uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          builder_changed:
            - 'builder/**'

    - name: Run test suite (with build)
      if: steps.filter.outputs.builder_changed == 'true'
      run: ./tests/test-build-wheels.sh

    - name: Run test suite (skip build, pull image)
      if: steps.filter.outputs.builder_changed == 'false'
      run: ./tests/test-build-wheels.sh --skip-build
