apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: install-and-import-wheels
spec:
  description: >-
    Extracts the built Python wheels from the SNAPSHOT, installs them
    onto the specified TEST_IMAGE, and tries to import the packages.
  params:
    - description: The JSON string of the Snapshot under test
      name: SNAPSHOT
      type: string
    - description: The image used for smoke testing the built wheels
      name: TEST_IMAGE
      type: string
    - description: Python version to use for testing (e.g. 3.12, 3.13)
      name: PYTHON_VERSION
      type: string
      default: "3.12"
  volumes:
    - name: workdir
      emptyDir: {}
    - name: wheel-check-scripts
      emptyDir: {}
  stepTemplate:
    env:
      - name: SNAPSHOT
        value: $(params.SNAPSHOT)
      - name: IMAGES_TXT
        value: /var/workdir/images.txt
      - name: FILES_DIR
        value: /var/workdir/files
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
      - name: wheel-check-scripts
        mountPath: /opt/wheel-check
  steps:
    - name: clone-scripts
      image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
      script: |
        #!/bin/bash
        set -euo pipefail

        REPO="https://github.com/calungaproject/plumbing.git"
        SCRIPTS_PATH="tasks/scripts/wheel-check"

        cd /tmp
        git clone --depth=1 --filter=blob:none --sparse "$REPO" plumbing
        cd plumbing
        git sparse-checkout set "$SCRIPTS_PATH"

        for f in ${SCRIPTS_PATH}/*.py; do
            case "$(basename "$f")" in test_*) continue;; esac
            cp "$f" /opt/wheel-check/
        done

        echo "Cloned wheel-check scripts:"
        ls -la /opt/wheel-check/

        cd /tmp
        rm -rf plumbing

    - name: get-image-urls
      image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
      script: |
        #!/bin/bash
        set -euo pipefail

        jq -r '.components[].containerImage' <<< "${SNAPSHOT}" | tee "${IMAGES_TXT}"

    - name: extract-wheels
      image: quay.io/konflux-ci/oras:latest@sha256:1beeecce012c99794568f74265c065839f9703d28306a8430b667f639343a98b
      script: |
        #!/bin/bash
        set -euo pipefail

        AUTHFILE='/tmp/auth.json'
        mkdir -p "${FILES_DIR}"

        while read -r IMAGE; do
          echo "Processing ${IMAGE}"
          select-oci-auth "${IMAGE}" > "${AUTHFILE}"
          retry oras pull --registry-config "${AUTHFILE}" "${IMAGE}" -o "${FILES_DIR}"
        done < "${IMAGES_TXT}"

        ls -la "${FILES_DIR}"

    - name: install-and-import
      image: $(params.TEST_IMAGE)
      # Run as root so hummingbird matches the other five images and can
      # install the packages below.
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/bash
        set -euo pipefail

        PYTHON="python$(params.PYTHON_VERSION)"

        if command -v "$PYTHON" >/dev/null 2>&1 && "$PYTHON" -m venv --help >/dev/null 2>&1; then
            echo "$PYTHON and venv are already available, skipping installation"
        elif command -v dnf >/dev/null 2>&1; then
            dnf install -y "$PYTHON"
        elif command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y "$PYTHON" "${PYTHON}-venv"
        else
            echo "ERROR: No supported package manager found and $PYTHON is not installed"
            exit 1
        fi

        # Runtime dependencies of the packages under test. Package names differ
        # by manager; the checks below use tool names and sonames, which do not.
        RUNTIME_DEPS_DNF=(git libgomp)
        RUNTIME_DEPS_APT=(git libgomp1)
        RUNTIME_TOOLS=(git)
        RUNTIME_LIBS=(libgomp.so.1)

        works() { command -v "$1" >/dev/null 2>&1 && "$1" --version >/dev/null 2>&1; }

        lib_present() { ldconfig -p 2>/dev/null | grep -qF "$1"; }

        if command -v dnf >/dev/null 2>&1; then
            dnf install -y "${RUNTIME_DEPS_DNF[@]}" || true
        elif command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y "${RUNTIME_DEPS_APT[@]}" || true
        fi

        for tool in "${RUNTIME_TOOLS[@]}"; do
            works "$tool" || echo "WARNING: $tool is unavailable or does not" \
                "run; wheels that resolve it at import time will fail here"
        done

        for lib in "${RUNTIME_LIBS[@]}"; do
            lib_present "$lib" || echo "WARNING: $lib is unavailable; wheels" \
                "that resolve it at import time, such as pythran, will fail here"
        done

        echo "Changing directory to ${FILES_DIR}"
        cd "${FILES_DIR}"

        $PYTHON /opt/wheel-check/run_wheel_check.py --python "$PYTHON"
