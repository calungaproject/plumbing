apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: install-and-import-wheels
spec:
  description: >-
    Extracts the built Python wheels from the SNAPSHOT, installs them
    onto the specified TEST_IMAGE, and tries to import the packages.
  params:
    - description: The JSON string of the Snapshot under test
      name: SNAPSHOT
      type: string
    - description: The image used for smoke testing the built wheels
      name: TEST_IMAGE
      type: string
    - description: Python version to use for testing (e.g. 3.12, 3.13)
      name: PYTHON_VERSION
      type: string
      default: "3.12"
  volumes:
    - name: workdir
      emptyDir: {}
    - name: wheel-check-scripts
      emptyDir: {}
  stepTemplate:
    env:
      - name: SNAPSHOT
        value: $(params.SNAPSHOT)
      - name: IMAGES_TXT
        value: /var/workdir/images.txt
      - name: FILES_DIR
        value: /var/workdir/files
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
      - name: wheel-check-scripts
        mountPath: /opt/wheel-check
  steps:
    - name: clone-scripts
      image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
      script: |
        #!/bin/bash
        set -euo pipefail

        REPO="https://github.com/calungaproject/plumbing.git"
        SCRIPTS_PATH="tasks/scripts/wheel-check"

        cd /tmp
        git clone --depth=1 --filter=blob:none --sparse "$REPO" plumbing
        cd plumbing
        git sparse-checkout set "$SCRIPTS_PATH"

        for f in ${SCRIPTS_PATH}/*.py; do
            case "$(basename "$f")" in test_*) continue;; esac
            cp "$f" /opt/wheel-check/
        done

        echo "Cloned wheel-check scripts:"
        ls -la /opt/wheel-check/

        cd /tmp
        rm -rf plumbing

    - name: get-image-urls
      image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
      script: |
        #!/bin/bash
        set -euo pipefail

        jq -r '.components[].containerImage' <<< "${SNAPSHOT}" | tee "${IMAGES_TXT}"

    - name: extract-wheels
      image: quay.io/konflux-ci/oras:latest@sha256:1beeecce012c99794568f74265c065839f9703d28306a8430b667f639343a98b
      script: |
        #!/bin/bash
        set -euo pipefail

        AUTHFILE='/tmp/auth.json'
        mkdir -p "${FILES_DIR}"

        while read -r IMAGE; do
          echo "Processing ${IMAGE}"
          select-oci-auth "${IMAGE}" > "${AUTHFILE}"
          retry oras pull --registry-config "${AUTHFILE}" "${IMAGE}" -o "${FILES_DIR}"
        done < "${IMAGES_TXT}"

        ls -la "${FILES_DIR}"

    - name: install-and-import
      image: $(params.TEST_IMAGE)
      script: |
        #!/bin/bash
        set -euo pipefail

        PYTHON="python$(params.PYTHON_VERSION)"

        if command -v "$PYTHON" >/dev/null 2>&1 && "$PYTHON" -m venv --help >/dev/null 2>&1; then
            echo "$PYTHON and venv are already available, skipping installation"
        elif command -v dnf >/dev/null 2>&1; then
            dnf install -y "$PYTHON"
        elif command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y "$PYTHON" "${PYTHON}-venv"
        else
            echo "ERROR: No supported package manager found and $PYTHON is not installed"
            exit 1
        fi

        # Tools some wheels need at import time, as opposed to build time.
        # Installed unconditionally: both package managers treat an
        # already-present package as a no-op and exit 0, so there is nothing to
        # detect first. Failures are tolerated here and judged below on whether
        # the tool actually ended up present -- the hummingbird image runs as
        # uid 65532 and cannot install anything.
        #
        # git: GitPython resolves the binary at import time and raises "Bad git
        # executable" without it, so gitpython cannot be imported. git is absent
        # from all six test images. This is a prerequisite of the package under
        # test rather than a defect in our wheel; PyPI's gitpython needs it too.
        RUNTIME_TOOLS=(git)

        # A PATH lookup is not enough. A partial unpack can leave usr/bin/git
        # in place while a shared library it needs is missing, and `command -v`
        # still reports it as available -- GitPython would then fail at import
        # with the very error this is meant to prevent. Run the tool instead.
        works() { command -v "$1" >/dev/null 2>&1 && "$1" --version >/dev/null 2>&1; }

        if command -v dnf >/dev/null 2>&1; then
            dnf install -y "${RUNTIME_TOOLS[@]}" || true
        elif command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y "${RUNTIME_TOOLS[@]}" || true
        fi

        # Fallback for an image that cannot install as root. The hummingbird
        # image runs as uid 65532 with no capabilities and no setuid helper, so
        # it can never become root and dnf cannot write to /usr. It can still
        # download, though, and the payload unpacks into a writable prefix.
        # git-core carries the binary without the perl tooling: 5 packages and
        # 7 MB, against 71 packages for the full git.
        if ! works git \
           && command -v dnf >/dev/null 2>&1 \
           && command -v rpm2archive >/dev/null 2>&1; then
            echo "Cannot install git as root; unpacking git-core into a prefix"
            GIT_PREFIX=/tmp/git-core-prefix
            RPM_DIR="$(mktemp -d)"
            if (cd "$RPM_DIR" && dnf download --resolve git-core >/dev/null 2>&1); then
                mkdir -p "$GIT_PREFIX"
                # rpm2archive writes the tarball to stdout here, so redirect it.
                for r in "$RPM_DIR"/*.rpm; do
                    rpm2archive "$r" > "$r.tgz" \
                        || echo "WARNING: rpm2archive failed for $(basename "$r")"
                done
                "$PYTHON" - "$RPM_DIR" "$GIT_PREFIX" <<'UNPACK_RPMS' \
                    || echo "WARNING: unpacking git-core did not complete"
        import glob
        import sys
        import tarfile

        src, dest = sys.argv[1], sys.argv[2]
        for archive in sorted(glob.glob(f'{src}/*.tgz')):
            with tarfile.open(archive) as tar:
                tar.extractall(dest, filter='tar')
        UNPACK_RPMS
                # git has compiled-in paths for its helpers and templates, so a
                # relocated copy needs both pointed at the prefix. These are
                # exported, not just set, because run_wheel_check.py reaches git
                # through a venv subprocess.
                export PATH="$GIT_PREFIX/usr/bin:$PATH"
                export LD_LIBRARY_PATH="$GIT_PREFIX/usr/lib64:${LD_LIBRARY_PATH:-}"
                export GIT_EXEC_PATH="$GIT_PREFIX/usr/libexec/git-core"
                export GIT_TEMPLATE_DIR="$GIT_PREFIX/usr/share/git-core/templates"
            fi
            rm -rf "$RPM_DIR"
        fi

        for tool in "${RUNTIME_TOOLS[@]}"; do
            works "$tool" || echo "WARNING: $tool is unavailable or does not" \
                "run; wheels that resolve it at import time will fail here"
        done

        echo "Changing directory to ${FILES_DIR}"
        cd "${FILES_DIR}"

        $PYTHON /opt/wheel-check/run_wheel_check.py --python "$PYTHON"
